<ul>
  <li *ngFor="let b of beers">
    {{ b }}
  </li>
</ul>

<div *ngFor="let b of beers">
  {{ b }}
  <br />
  <button (click)="Vote(b)">vote</button><br />
  <span>Votes:{{ CountVotes(b) }}</span>
  <hr />
</div>

<h1>{{ counter }}</h1>
<button (click)="Increment()">+</button>
<button (click)="Decrement()">-</button>
